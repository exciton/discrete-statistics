recompute:
  name: Recompute
  description: >-
    Recompute discrete statistics from recorder history. Omit start for a
    full backfill from the oldest retained state.
  fields:
    entity_id:
      name: Entity
      description: Entity to recompute. Omit for every configured entity.
      required: false
      selector:
        entity:
    start:
      name: Start
      description: >-
        Local time to recompute from. Omit to start at the oldest
        retained state.
      required: false
      selector:
        datetime:
