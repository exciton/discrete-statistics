name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch HACS/hassfest rule changes without a push.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Locally the suite runs in a container because the host Python is
      # too old for Home Assistant; a runner can supply the interpreter
      # directly, which is a minute faster than building the image. Keep
      # python-version on the same minor as .devcontainer/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest tests/ -q
