name: Release

on:
  release:
    types: [published]

jobs:
  version:
    name: Tag matches manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # HACS reads the version from the release tag; Home Assistant reads it
      # from manifest.json. A release where they differ shows one version in
      # HACS and another on the integration page.
      - run: |
          manifest=$(python3 -c 'import json; print(json.load(open("custom_components/discrete_statistics/manifest.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi
